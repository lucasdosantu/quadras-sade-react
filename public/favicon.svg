<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Pino do Mapa -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#d32f2f" />
    </linearGradient>

    <!-- Sombra para dar destaque e profundidade -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- MAPA DOBRADO DE FUNDO (Centralizado e ampliado) -->
  <g filter="url(#shadow)">
    <polygon points="80,220 256,170 256,460 80,390" fill="#4caf50" />
    <polygon points="256,170 432,220 432,390 256,460" fill="#29b6f6" />
    <polygon points="130,235 256,195 256,415 130,360" fill="#ffca28" />
    <polygon points="256,195 382,235 382,360 256,415" fill="#ffa726" />
    <polygon points="80,220 170,255 170,380 80,390" fill="#26a69a" />
    <polygon points="342,255 432,220 432,390 342,355" fill="#ab47bc" />
  </g>

  <!-- PINO DE LOCALIZAÇÃO (PIN) -->
  <g filter="url(#shadow)">
    <path d="M256,40 C172,40 104,108 104,192 C104,288 256,432 256,432 C256,432 408,288 408,192 C408,108 340,40 256,40 Z" fill="url(#pinGrad)" />
    <!-- Círculo interno do pino -->
    <circle cx="256" cy="192" r="56" fill="#ffffff" opacity="0.95" />
  </g>
</svg>